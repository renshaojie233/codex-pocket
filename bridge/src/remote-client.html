<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111217">
  <title>Codex Pocket Remote Desktop</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111217; }
    button, textarea { font: inherit; }
    #screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #111217; }
    #screen canvas { position: relative; z-index: 1; image-rendering: auto; }
    #frameMirror {
      position: absolute; z-index: 2; inset: 0; display: none; margin: auto;
      pointer-events: none; object-fit: contain; image-rendering: auto;
    }
    #screen.mirror-active #frameMirror { display: block; }
    #screen.mirror-active canvas { opacity: 0; }
    #status {
      position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); z-index: 5;
      transform: translateX(-50%); max-width: calc(100% - 28px); padding: 8px 13px;
      border-radius: 999px; background: rgba(25, 26, 34, .86); color: #d8d8e5;
      box-shadow: 0 6px 28px rgba(0,0,0,.32); backdrop-filter: blur(14px);
      font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: opacity .25s ease;
    }
    #status.connected { color: #a9f2cc; opacity: .78; }
    #toolbar {
      position: fixed; z-index: 6; left: 50%; bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%); display: flex; gap: 7px; padding: 7px;
      border: 1px solid rgba(255,255,255,.10); border-radius: 18px;
      background: rgba(24,25,32,.88); box-shadow: 0 8px 28px rgba(0,0,0,.38); backdrop-filter: blur(16px);
    }
    #toolbar button {
      min-width: 43px; height: 41px; padding: 0 11px; border: 0; border-radius: 12px;
      background: rgba(255,255,255,.08); color: #f2f2f7; font-weight: 650;
    }
    #toolbar button:active { background: #625bff; transform: scale(.96); }
    #keyboardPanel {
      position: fixed; z-index: 7; left: 10px; right: 10px;
      bottom: max(68px, calc(env(safe-area-inset-bottom) + 68px)); display: none;
      padding: 9px; border-radius: 17px; background: rgba(24,25,32,.94);
      border: 1px solid rgba(255,255,255,.12); box-shadow: 0 10px 36px rgba(0,0,0,.45);
    }
    #keyboardPanel.open { display: block; }
    #keyboardInput {
      width: 100%; height: 46px; resize: none; border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px; padding: 12px 14px; background: #30313b; color: white; outline: none;
    }
    #keyboardInput::placeholder { color: #9c9daa; }
    html.native-host #status,
    html.native-host #toolbar,
    html.native-host #keyboardPanel { display: none !important; }
  </style>
</head>
<body>
  <div id="screen"><img id="frameMirror" alt="远程桌面画面"></div>
  <div id="status">正在建立安全通道…</div>
  <div id="keyboardPanel"><textarea id="keyboardInput" rows="1" placeholder="输入内容并发送到远程电脑…" autocomplete="off" autocapitalize="off"></textarea></div>
  <div id="toolbar">
    <button id="keyboardButton" aria-label="键盘">键盘</button>
    <button id="ctrlAltDelButton" aria-label="Ctrl Alt Delete">CAD</button>
    <button id="fitButton" aria-label="适应屏幕">适应</button>
    <button id="reconnectButton" aria-label="重新连接">重连</button>
  </div>
  <script type="module">
    import RFB from "/remote-assets/core/rfb.js";

    const device = __DEVICE_JSON__;
    const token = __TOKEN_JSON__;
    const credentials = { password: __PASSWORD_JSON__ };
    const screen = document.getElementById("screen");
    const status = document.getElementById("status");
    const frameMirror = document.getElementById("frameMirror");
    const keyboardPanel = document.getElementById("keyboardPanel");
    const keyboardInput = document.getElementById("keyboardInput");
    const renderMode = new URLSearchParams(location.search).get("render") || "compat";
    const useFrameMirror = /\bwv\)/i.test(navigator.userAgent) && renderMode !== "hardware";
    const mirrorBuffer = document.createElement("canvas");
    const nativePatchBuffer = document.createElement("canvas");
    let rfb = null;
    let scaleToFit = true;
    let scaleRefreshTimer = 0;
    let mirrorTimer = 0;
    let mirrorTimerDueAt = 0;
    let mirrorBusy = false;
    let mirrorUrl = "";
    let mirrorRunning = false;
    let lastInteractionAt = performance.now();
    let lastMirrorAt = 0;
    let nativeFrameReported = false;
    let nativeQualityMode = "auto";
    let nativeFrameMode = "smart";
    let nativeEncodeBusy = false;
    let pendingDamage = null;
    let forceFullFrame = true;
    let lastNativeFrameWidth = 0;
    let lastNativeFrameHeight = 0;
    let lastFullFrameAt = 0;
    let nativeFrameSequence = 0;
    let performanceReportAt = performance.now();
    let performanceFrames = 0;
    let performanceBytes = 0;
    let performanceSourcePixels = 0;
    let performanceEncodedPixels = 0;
    let performanceEncodeMillis = 0;
    let binaryTransportFailed = false;

    function nativeFrameBridge() {
      const bridge = window.CodexPocketNativeFrame;
      return bridge && typeof bridge.onFrame === "function" ? bridge : null;
    }

    function nativeBinaryFrameBridge() {
      if (binaryTransportFailed) return null;
      const bridge = window.CodexPocketBinaryFrame;
      return bridge && typeof bridge.postMessage === "function" ? bridge : null;
    }

    if (nativeFrameBridge()) {
      document.documentElement.classList.add("native-host");
    }

    function nativeFrameWidth(canvas, cssWidth) {
      switch (nativeQualityMode) {
        case "smooth": return Math.min(canvas.width, 960);
        case "high": return Math.min(canvas.width, 1280);
        case "original": return canvas.width;
        default:
          return Math.min(canvas.width, 1920, Math.round(cssWidth * devicePixelRatio));
      }
    }

    function nativeFrameJpegQuality() {
      switch (nativeQualityMode) {
        case "smooth": return 0.72;
        case "high": return 0.80;
        case "original": return 0.86;
        default: return 0.82;
      }
    }

    function mirrorInterval() {
      switch (nativeFrameMode) {
        case "low-latency": return 33;
        case "balanced": return 100;
        case "power-save": return 250;
        default:
          return performance.now() - lastInteractionAt < 2_000 ? 33 : 125;
      }
    }

    function scheduleMirror(delay = mirrorInterval()) {
      if (!mirrorRunning) return;
      const normalizedDelay = Math.max(0, delay);
      const dueAt = performance.now() + normalizedDelay;
      if (mirrorTimer && mirrorTimerDueAt <= dueAt) return;
      clearTimeout(mirrorTimer);
      mirrorTimerDueAt = dueAt;
      mirrorTimer = setTimeout(() => {
        mirrorTimer = 0;
        mirrorTimerDueAt = 0;
        updateMirror();
        scheduleMirror();
      }, normalizedDelay);
    }

    function markInteraction() {
      const now = performance.now();
      lastInteractionAt = now;
      if (mirrorRunning && now - lastMirrorAt >= 40) scheduleMirror(0);
    }

    function report(event, details = {}) {
      const payload = {
        device: device.id,
        event,
        renderMode,
        secure: window.isSecureContext,
        viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
        userAgent: navigator.userAgent,
        ...details,
      };
      fetch(`/remote/diagnostics?token=${encodeURIComponent(token)}`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
        keepalive: true,
      }).catch(() => {});
    }

    function reportCanvas() {
      const canvas = screen.querySelector("canvas");
      if (!canvas) {
        report("canvas-missing");
        return;
      }
      const bounds = canvas.getBoundingClientRect();
      let pixels = null;
      try {
        const probe = document.createElement("canvas");
        probe.width = 32;
        probe.height = 18;
        const context = probe.getContext("2d", { willReadFrequently: true });
        context.drawImage(canvas, 0, 0, probe.width, probe.height);
        const data = context.getImageData(0, 0, probe.width, probe.height).data;
        let minimum = 255;
        let maximum = 0;
        let visible = 0;
        for (let index = 0; index < data.length; index += 4) {
          const value = Math.round((data[index] + data[index + 1] + data[index + 2]) / 3);
          minimum = Math.min(minimum, value);
          maximum = Math.max(maximum, value);
          if (value > 8) visible += 1;
        }
        pixels = { minimum, maximum, visible, total: data.length / 4 };
      } catch (error) {
        pixels = { error: error.message || String(error) };
      }
      report("canvas", {
        canvas: {
          width: canvas.width,
          height: canvas.height,
          clientWidth: Math.round(bounds.width),
          clientHeight: Math.round(bounds.height),
          top: Math.round(bounds.top),
          left: Math.round(bounds.left),
        },
        mirror: {
          active: screen.classList.contains("mirror-active"),
          width: Math.round(frameMirror.getBoundingClientRect().width),
          height: Math.round(frameMirror.getBoundingClientRect().height),
          naturalWidth: frameMirror.naturalWidth,
          naturalHeight: frameMirror.naturalHeight,
        },
        pixels,
      });
    }

    window.addEventListener("error", event => report("window-error", { message: event.message }));
    window.addEventListener("unhandledrejection", event => {
      report("unhandled-rejection", { message: event.reason?.message || String(event.reason) });
    });
    report("page-ready");

    history.replaceState(null, "", `/remote/client?device=${encodeURIComponent(device.id)}`);

    function setStatus(message, connected = false) {
      status.textContent = message;
      status.classList.toggle("connected", connected);
    }

    function websocketUrl() {
      const scheme = location.protocol === "https:" ? "wss:" : "ws:";
      const params = new URLSearchParams({ device: device.id, token });
      return `${scheme}//${location.host}/remote/ws?${params}`;
    }

    function applyScale() {
      if (!rfb) return;
      const canvas = screen.querySelector("canvas");
      if (!canvas || canvas.width <= 0 || canvas.height <= 0) return;
      const availableWidth = Math.max(1, innerWidth || document.documentElement.clientWidth);
      const availableHeight = Math.max(1, innerHeight || document.documentElement.clientHeight);
      const factor = scaleToFit
        ? Math.min(availableWidth / canvas.width, availableHeight / canvas.height)
        : 1;

      // noVNC's public scaleViewport path reads a zero-sized Compose host on
      // HyperOS. Set the Display scale from the real WebView viewport so both
      // visual size and pointer-coordinate conversion use the same factor.
      rfb.scaleViewport = false;
      if (rfb._display) {
        rfb._display.scale = factor;
      } else {
        canvas.style.width = `${canvas.width * factor}px`;
        canvas.style.height = `${canvas.height * factor}px`;
      }
      frameMirror.style.width = `${canvas.width * factor}px`;
      frameMirror.style.height = `${canvas.height * factor}px`;
    }

    function refreshScale(delay = 0) {
      clearTimeout(scaleRefreshTimer);
      scaleRefreshTimer = setTimeout(() => {
        applyScale();
      }, delay);
    }

    function mergeDamage(rect) {
      if (!rect || rect.width <= 0 || rect.height <= 0) return;
      if (!pendingDamage) {
        pendingDamage = { ...rect };
      } else {
        const right = Math.max(pendingDamage.x + pendingDamage.width, rect.x + rect.width);
        const bottom = Math.max(pendingDamage.y + pendingDamage.height, rect.y + rect.height);
        pendingDamage.x = Math.min(pendingDamage.x, rect.x);
        pendingDamage.y = Math.min(pendingDamage.y, rect.y);
        pendingDamage.width = right - pendingDamage.x;
        pendingDamage.height = bottom - pendingDamage.y;
      }
      if (mirrorRunning && performance.now() - lastMirrorAt >= 35) scheduleMirror(0);
    }

    function visibleDisplayDamage(display) {
      const bounds = display?._damageBounds;
      const viewport = display?._viewportLoc;
      if (!bounds || !viewport) return null;
      let x = bounds.left;
      let y = bounds.top;
      let width = bounds.right - x;
      let height = bounds.bottom - y;
      let visibleX = x - viewport.x;
      let visibleY = y - viewport.y;
      if (visibleX < 0) {
        width += visibleX;
        x -= visibleX;
        visibleX = 0;
      }
      if (visibleY < 0) {
        height += visibleY;
        y -= visibleY;
        visibleY = 0;
      }
      if (visibleX + width > viewport.w) width = viewport.w - visibleX;
      if (visibleY + height > viewport.h) height = viewport.h - visibleY;
      if (width <= 0 || height <= 0) return null;
      return { x: visibleX, y: visibleY, width, height };
    }

    function installDamageTracking() {
      const display = rfb?._display;
      if (!display || display.__codexPocketDamageTracking) return;
      const originalFlip = display.flip.bind(display);
      display.flip = function(fromQueue) {
        const damage = (this._renderQ.length === 0 || fromQueue)
          ? visibleDisplayDamage(this)
          : null;
        const result = originalFlip(fromQueue);
        if (damage) mergeDamage(damage);
        return result;
      };
      display.__codexPocketDamageTracking = true;
    }

    function requestFullFrame() {
      forceFullFrame = true;
      scheduleMirror(0);
    }

    function scaledPatch(damage, canvas, targetWidth, targetHeight) {
      const full = forceFullFrame || !damage;
      if (full) {
        return {
          x: 0, y: 0, width: targetWidth, height: targetHeight,
          sourceX: 0, sourceY: 0, sourceWidth: canvas.width, sourceHeight: canvas.height,
          full: true,
        };
      }
      const scaleX = targetWidth / canvas.width;
      const scaleY = targetHeight / canvas.height;
      const x = Math.max(0, Math.floor(damage.x * scaleX));
      const y = Math.max(0, Math.floor(damage.y * scaleY));
      const right = Math.min(targetWidth, Math.ceil((damage.x + damage.width) * scaleX));
      const bottom = Math.min(targetHeight, Math.ceil((damage.y + damage.height) * scaleY));
      const width = Math.max(1, right - x);
      const height = Math.max(1, bottom - y);
      if ((width * height) / (targetWidth * targetHeight) > 0.72) {
        return {
          x: 0, y: 0, width: targetWidth, height: targetHeight,
          sourceX: 0, sourceY: 0, sourceWidth: canvas.width, sourceHeight: canvas.height,
          full: true,
        };
      }
      return {
        x, y, width, height,
        sourceX: x / scaleX,
        sourceY: y / scaleY,
        sourceWidth: width / scaleX,
        sourceHeight: height / scaleY,
        full: false,
      };
    }

    function binaryFramePacket(jpeg, frame, targetWidth, targetHeight, canvas) {
      const headerSize = 44;
      const packet = new Uint8Array(headerSize + jpeg.byteLength);
      const header = new DataView(packet.buffer, 0, headerSize);
      header.setUint32(0, 0x43505246); // CPRF
      header.setUint8(4, 1);
      header.setUint8(5, frame.full ? 1 : 0);
      header.setUint16(6, 0);
      header.setUint32(8, targetWidth);
      header.setUint32(12, targetHeight);
      header.setUint32(16, frame.x);
      header.setUint32(20, frame.y);
      header.setUint32(24, frame.width);
      header.setUint32(28, frame.height);
      header.setUint32(32, canvas.width);
      header.setUint32(36, canvas.height);
      header.setUint32(40, ++nativeFrameSequence);
      packet.set(new Uint8Array(jpeg), headerSize);
      return packet.buffer;
    }

    function restoreDamage(frame, canvas) {
      if (frame.full) {
        forceFullFrame = true;
      } else {
        mergeDamage({
          x: frame.sourceX,
          y: frame.sourceY,
          width: frame.sourceWidth,
          height: frame.sourceHeight,
        });
      }
    }

    function recordFramePerformance(frame, bytes, encodeMillis, targetWidth, targetHeight) {
      performanceFrames += 1;
      performanceBytes += bytes;
      performanceSourcePixels += targetWidth * targetHeight;
      performanceEncodedPixels += frame.width * frame.height;
      performanceEncodeMillis += encodeMillis;
      const now = performance.now();
      if (now - performanceReportAt < 5_000) return;
      report("remote-performance", {
        transport: nativeBinaryFrameBridge() ? "binary-damage" : "base64-full",
        intervalMillis: Math.round(now - performanceReportAt),
        frames: performanceFrames,
        encodedBytes: performanceBytes,
        averageEncodeMillis: performanceFrames
          ? Math.round(performanceEncodeMillis / performanceFrames * 10) / 10
          : 0,
        encodedPixelRatio: performanceSourcePixels
          ? Math.round(performanceEncodedPixels / performanceSourcePixels * 1_000) / 1_000
          : 0,
        qualityMode: nativeQualityMode,
        frameMode: nativeFrameMode,
      });
      performanceReportAt = now;
      performanceFrames = 0;
      performanceBytes = 0;
      performanceSourcePixels = 0;
      performanceEncodedPixels = 0;
      performanceEncodeMillis = 0;
    }

    function updateMirror() {
      const nativeBridge = nativeFrameBridge();
      if ((!useFrameMirror && !nativeBridge) || document.hidden) return;
      if (nativeBridge && nativeEncodeBusy) return;
      if (!nativeBridge && mirrorBusy) return;
      if (
        nativeBridge &&
        typeof nativeBridge.canAcceptFrame === "function" &&
        !nativeBridge.canAcceptFrame()
      ) return;
      const canvas = screen.querySelector("canvas");
      if (!canvas || canvas.width <= 0 || canvas.height <= 0) return;
      lastMirrorAt = performance.now();
      applyScale();
      const bounds = canvas.getBoundingClientRect();
      const cssWidth = Math.max(1, Math.round(bounds.width || innerWidth));
      const targetWidth = nativeBridge
        ? Math.max(1, nativeFrameWidth(canvas, cssWidth))
        : Math.max(1, Math.min(1280, cssWidth));
      const targetHeight = Math.max(1, Math.round(targetWidth * canvas.height / canvas.width));
      if (nativeBridge) {
        if (targetWidth !== lastNativeFrameWidth || targetHeight !== lastNativeFrameHeight) {
          lastNativeFrameWidth = targetWidth;
          lastNativeFrameHeight = targetHeight;
          forceFullFrame = true;
        }
        if (!forceFullFrame && !pendingDamage) return;
        if (performance.now() - lastFullFrameAt > 15_000) forceFullFrame = true;
        const damage = pendingDamage;
        const frame = scaledPatch(damage, canvas, targetWidth, targetHeight);
        pendingDamage = null;
        forceFullFrame = false;
        if (nativePatchBuffer.width !== frame.width) nativePatchBuffer.width = frame.width;
        if (nativePatchBuffer.height !== frame.height) nativePatchBuffer.height = frame.height;
        const context = nativePatchBuffer.getContext("2d", { alpha: false });
        context.drawImage(
          canvas,
          frame.sourceX, frame.sourceY, frame.sourceWidth, frame.sourceHeight,
          0, 0, frame.width, frame.height,
        );
        const binaryBridge = nativeBinaryFrameBridge();
        const encodeStartedAt = performance.now();
        if (binaryBridge) {
          nativeEncodeBusy = true;
          nativePatchBuffer.toBlob(blob => {
            if (!blob) {
              nativeEncodeBusy = false;
              restoreDamage(frame, canvas);
              return;
            }
            blob.arrayBuffer().then(jpeg => {
              try {
                binaryBridge.postMessage(
                  binaryFramePacket(jpeg, frame, targetWidth, targetHeight, canvas),
                );
                if (frame.full) lastFullFrameAt = performance.now();
                recordFramePerformance(
                  frame,
                  jpeg.byteLength,
                  performance.now() - encodeStartedAt,
                  targetWidth,
                  targetHeight,
                );
                if (!nativeFrameReported) {
                  nativeFrameReported = true;
                  report("native-frame", {
                    transport: "binary-damage",
                    canvas: { width: canvas.width, height: canvas.height },
                    nativeFrame: {
                      width: targetWidth,
                      height: targetHeight,
                      encodedBytes: jpeg.byteLength,
                      patch: { x: frame.x, y: frame.y, width: frame.width, height: frame.height },
                      qualityMode: nativeQualityMode,
                      frameMode: nativeFrameMode,
                    },
                  });
                }
              } catch (error) {
                binaryTransportFailed = true;
                restoreDamage(frame, canvas);
                report("native-binary-frame-error", { message: error.message || String(error) });
              } finally {
                nativeEncodeBusy = false;
              }
            }).catch(error => {
              nativeEncodeBusy = false;
              restoreDamage(frame, canvas);
              report("native-frame-error", { message: error.message || String(error) });
            });
          }, "image/jpeg", nativeFrameJpegQuality());
          return;
        }
        // Compatibility fallback for old Android System WebView versions.
        // It stays full-frame because the legacy JavascriptInterface only
        // understands complete images.
        try {
          if (!frame.full) {
            forceFullFrame = true;
            return;
          }
          const encoded = nativePatchBuffer.toDataURL("image/jpeg", nativeFrameJpegQuality());
          const accepted = nativeBridge.onFrame(
            encoded,
            targetWidth,
            targetHeight,
            canvas.width,
            canvas.height,
          );
          if (!accepted) restoreDamage(frame, canvas);
          else {
            lastFullFrameAt = performance.now();
            recordFramePerformance(
              frame,
              encoded.length,
              performance.now() - encodeStartedAt,
              targetWidth,
              targetHeight,
            );
          }
        } catch (error) {
          restoreDamage(frame, canvas);
          report("native-frame-error", { message: error.message || String(error) });
        }
        return;
      }
      if (!useFrameMirror) return;
      if (mirrorBuffer.width !== targetWidth) mirrorBuffer.width = targetWidth;
      if (mirrorBuffer.height !== targetHeight) mirrorBuffer.height = targetHeight;
      const context = mirrorBuffer.getContext("2d", { alpha: false });
      context.drawImage(canvas, 0, 0, targetWidth, targetHeight);
      mirrorBusy = true;
      mirrorBuffer.toBlob(blob => {
        mirrorBusy = false;
        if (!blob) return;
        const nextUrl = URL.createObjectURL(blob);
        frameMirror.onload = () => {
          if (mirrorUrl) URL.revokeObjectURL(mirrorUrl);
          mirrorUrl = nextUrl;
          screen.classList.add("mirror-active");
        };
        frameMirror.src = nextUrl;
      }, "image/jpeg", 0.78);
    }

    function startMirror() {
      clearTimeout(mirrorTimer);
      mirrorTimer = 0;
      mirrorTimerDueAt = 0;
      if (!useFrameMirror && !nativeFrameBridge()) return;
      mirrorRunning = true;
      lastInteractionAt = performance.now();
      pendingDamage = null;
      forceFullFrame = true;
      scheduleMirror(0);
    }

    function stopMirror() {
      mirrorRunning = false;
      clearTimeout(mirrorTimer);
      mirrorTimer = 0;
      mirrorTimerDueAt = 0;
      pendingDamage = null;
      forceFullFrame = true;
      screen.classList.remove("mirror-active");
    }

    function applyVncEncodingSettings() {
      if (!rfb) return;
      const settings = {
        smooth: { quality: 4, compression: 3 },
        high: { quality: 7, compression: 2 },
        original: { quality: 9, compression: 1 },
        auto: { quality: 7, compression: 2 },
      }[nativeQualityMode] || { quality: 7, compression: 2 };
      rfb.qualityLevel = settings.quality;
      rfb.compressionLevel = nativeFrameMode === "low-latency"
        ? Math.min(settings.compression, 1)
        : settings.compression;
    }

    function connect() {
      if (rfb) {
        try { rfb.disconnect(); } catch (_) { /* already closed */ }
      }
      setStatus(`正在连接 ${device.name}…`);
      rfb = new RFB(screen, websocketUrl(), { credentials, shared: true });
      rfb.scaleViewport = false;
      rfb.resizeSession = false;
      rfb.clipViewport = false;
      rfb.dragViewport = false;
      rfb.focusOnClick = true;
      rfb.viewOnly = false;
      rfb.showDotCursor = true;
      applyVncEncodingSettings();
      installDamageTracking();
      rfb.addEventListener("connect", () => {
        setStatus(`${device.name} 已连接`, true);
        nativeFrameBridge()?.onStatus?.(`${device.name} 已连接`, true);
        rfb.focus();
        refreshScale();
        refreshScale(250);
        setTimeout(() => refreshScale(), 1_000);
        installDamageTracking();
        startMirror();
        report("connected");
        setTimeout(reportCanvas, 1_000);
        setTimeout(reportCanvas, 4_000);
      });
      rfb.addEventListener("credentialsrequired", () => rfb.sendCredentials(credentials));
      rfb.addEventListener("disconnect", event => {
        stopMirror();
        setStatus(event.detail.clean ? `${device.name} 已断开` : "连接中断，可以点击重连");
        nativeFrameBridge()?.onStatus?.(
          event.detail.clean ? `${device.name} 已断开` : "连接中断，可以点击重连",
          false,
        );
        report("disconnected", { message: event.detail.clean ? "clean" : "unclean" });
      });
      rfb.addEventListener("securityfailure", event => {
        setStatus(event.detail.reason || "远程桌面认证失败");
        report("security-failure", { message: event.detail.reason || "authentication failed" });
      });
      rfb.addEventListener("desktopname", event => {
        document.title = `${event.detail.name || device.name} · Codex Pocket`;
      });
    }

    function sendKeysym(keysym, code = null) {
      if (rfb) rfb.sendKey(keysym, code);
    }

    function sendText(text) {
      if (!rfb || !text) return;
      markInteraction();
      for (const character of text) {
        const point = character.codePointAt(0);
        if (point > 0xff) {
          rfb.clipboardPasteFrom(character);
          rfb.sendKey(0xffe3, "ControlLeft", true);
          rfb.sendKey(0x76, "KeyV", true);
          rfb.sendKey(0x76, "KeyV", false);
          rfb.sendKey(0xffe3, "ControlLeft", false);
        } else {
          sendKeysym(point);
        }
      }
    }

    document.getElementById("keyboardButton").addEventListener("click", () => {
      keyboardPanel.classList.toggle("open");
      if (keyboardPanel.classList.contains("open")) {
        keyboardInput.focus();
      } else {
        keyboardInput.blur();
        rfb?.focus();
      }
    });
    keyboardInput.addEventListener("input", event => {
      const text = event.data || keyboardInput.value;
      sendText(text);
      keyboardInput.value = "";
    });
    keyboardInput.addEventListener("keydown", event => {
      markInteraction();
      const special = {
        Enter: 0xff0d, Backspace: 0xff08, Tab: 0xff09, Escape: 0xff1b,
        ArrowLeft: 0xff51, ArrowUp: 0xff52, ArrowRight: 0xff53, ArrowDown: 0xff54,
        Delete: 0xffff,
      }[event.key];
      if (special) {
        event.preventDefault();
        event.stopPropagation();
        sendKeysym(special, event.code || null);
      }
    });
    screen.addEventListener("pointerdown", markInteraction, { capture: true, passive: true });
    screen.addEventListener("pointermove", markInteraction, { capture: true, passive: true });
    screen.addEventListener("pointerup", markInteraction, { capture: true, passive: true });
    screen.addEventListener("wheel", markInteraction, { capture: true, passive: true });
    document.getElementById("ctrlAltDelButton").addEventListener("click", () => {
      markInteraction();
      rfb?.sendCtrlAltDel();
    });
    document.getElementById("fitButton").addEventListener("click", event => {
      scaleToFit = !scaleToFit;
      refreshScale();
      event.currentTarget.textContent = scaleToFit ? "适应" : "原始";
    });
    document.getElementById("reconnectButton").addEventListener("click", connect);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) keyboardInput.blur();
    });
    window.codexPocketRemoteDisconnect = () => {
      stopMirror();
      try { rfb?.disconnect(); } catch (_) { /* already disconnected */ }
    };
    window.codexPocketRemoteReconnect = connect;
    window.codexPocketNativeReconnect = connect;
    window.codexPocketNativeCtrlAltDelete = () => rfb?.sendCtrlAltDel();
    window.codexPocketNativeSendText = sendText;
    window.codexPocketNativeSetQuality = mode => {
      const allowed = new Set(["auto", "smooth", "high", "original"]);
      if (!allowed.has(mode)) return;
      nativeQualityMode = mode;
      applyVncEncodingSettings();
      nativeFrameReported = false;
      requestFullFrame();
      scheduleMirror(0);
    };
    window.codexPocketNativeSetFrameMode = mode => {
      const allowed = new Set(["smart", "low-latency", "balanced", "power-save"]);
      if (!allowed.has(mode)) return;
      nativeFrameMode = mode;
      applyVncEncodingSettings();
      lastInteractionAt = performance.now();
      nativeFrameReported = false;
      scheduleMirror(0);
    };
    window.codexPocketRequestFullFrame = requestFullFrame;
    window.codexPocketNativeFrameDisplayed = (width, height) => {
      report("native-frame-displayed", {
        nativeFrame: {
          width: Number(width) || 0,
          height: Number(height) || 0,
          qualityMode: nativeQualityMode,
          frameMode: nativeFrameMode,
        },
      });
    };
    window.addEventListener("resize", () => refreshScale(100));
    window.addEventListener("orientationchange", () => refreshScale(250));
    new ResizeObserver(() => {
      const canvas = screen.querySelector("canvas");
      if (canvas && canvas.getBoundingClientRect().width === 0) refreshScale(50);
    }).observe(screen);
    connect();
  </script>
</body>
</html>
