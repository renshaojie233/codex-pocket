<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111217">
  <title>Codex Pocket Remote Desktop</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111217; }
    button, textarea { font: inherit; }
    #screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #111217; }
    #screen canvas { position: relative; z-index: 1; image-rendering: auto; }
    #frameMirror {
      position: absolute; z-index: 2; inset: 0; display: none; margin: auto;
      pointer-events: none; object-fit: contain; image-rendering: auto;
    }
    #screen.mirror-active #frameMirror { display: block; }
    #screen.mirror-active canvas { opacity: 0; }
    #status {
      position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); z-index: 5;
      transform: translateX(-50%); max-width: calc(100% - 28px); padding: 8px 13px;
      border-radius: 999px; background: rgba(25, 26, 34, .86); color: #d8d8e5;
      box-shadow: 0 6px 28px rgba(0,0,0,.32); backdrop-filter: blur(14px);
      font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: opacity .25s ease;
    }
    #status.connected { color: #a9f2cc; opacity: .78; }
    #toolbar {
      position: fixed; z-index: 6; left: 50%; bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%); display: flex; gap: 7px; padding: 7px;
      border: 1px solid rgba(255,255,255,.10); border-radius: 18px;
      background: rgba(24,25,32,.88); box-shadow: 0 8px 28px rgba(0,0,0,.38); backdrop-filter: blur(16px);
    }
    #toolbar button {
      min-width: 43px; height: 41px; padding: 0 11px; border: 0; border-radius: 12px;
      background: rgba(255,255,255,.08); color: #f2f2f7; font-weight: 650;
    }
    #toolbar button:active { background: #625bff; transform: scale(.96); }
    #keyboardPanel {
      position: fixed; z-index: 7; left: 10px; right: 10px;
      bottom: max(68px, calc(env(safe-area-inset-bottom) + 68px)); display: none;
      padding: 9px; border-radius: 17px; background: rgba(24,25,32,.94);
      border: 1px solid rgba(255,255,255,.12); box-shadow: 0 10px 36px rgba(0,0,0,.45);
    }
    #keyboardPanel.open { display: block; }
    #keyboardInput {
      width: 100%; height: 46px; resize: none; border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px; padding: 12px 14px; background: #30313b; color: white; outline: none;
    }
    #keyboardInput::placeholder { color: #9c9daa; }
    html.native-host #status,
    html.native-host #toolbar,
    html.native-host #keyboardPanel { display: none !important; }
  </style>
</head>
<body>
  <div id="screen"><img id="frameMirror" alt="远程桌面画面"></div>
  <div id="status">正在建立安全通道…</div>
  <div id="keyboardPanel"><textarea id="keyboardInput" rows="1" placeholder="输入内容并发送到远程电脑…" autocomplete="off" autocapitalize="off"></textarea></div>
  <div id="toolbar">
    <button id="keyboardButton" aria-label="键盘">键盘</button>
    <button id="ctrlAltDelButton" aria-label="Ctrl Alt Delete">CAD</button>
    <button id="fitButton" aria-label="适应屏幕">适应</button>
    <button id="reconnectButton" aria-label="重新连接">重连</button>
  </div>
  <script type="module">
    import RFB from "/remote-assets/core/rfb.js";

    const device = __DEVICE_JSON__;
    const token = __TOKEN_JSON__;
    const credentials = { password: __PASSWORD_JSON__ };
    const screen = document.getElementById("screen");
    const status = document.getElementById("status");
    const frameMirror = document.getElementById("frameMirror");
    const keyboardPanel = document.getElementById("keyboardPanel");
    const keyboardInput = document.getElementById("keyboardInput");
    const renderMode = new URLSearchParams(location.search).get("render") || "compat";
    const useFrameMirror = /\bwv\)/i.test(navigator.userAgent) && renderMode !== "hardware";
    const mirrorBuffer = document.createElement("canvas");
    let rfb = null;
    let scaleToFit = true;
    let scaleRefreshTimer = 0;
    let mirrorTimer = 0;
    let mirrorBusy = false;
    let mirrorUrl = "";
    let nativeFrameReported = false;
    let nativeQualityMode = "auto";

    function nativeFrameBridge() {
      const bridge = window.CodexPocketNativeFrame;
      return bridge && typeof bridge.onFrame === "function" ? bridge : null;
    }

    if (nativeFrameBridge()) {
      document.documentElement.classList.add("native-host");
    }

    function nativeFrameWidth(canvas, cssWidth) {
      switch (nativeQualityMode) {
        case "smooth": return Math.min(canvas.width, 960);
        case "high": return Math.min(canvas.width, 1280);
        case "original": return canvas.width;
        default:
          return Math.min(canvas.width, 1920, Math.round(cssWidth * devicePixelRatio));
      }
    }

    function report(event, details = {}) {
      const payload = {
        device: device.id,
        event,
        renderMode,
        secure: window.isSecureContext,
        viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
        userAgent: navigator.userAgent,
        ...details,
      };
      fetch(`/remote/diagnostics?token=${encodeURIComponent(token)}`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
        keepalive: true,
      }).catch(() => {});
    }

    function reportCanvas() {
      const canvas = screen.querySelector("canvas");
      if (!canvas) {
        report("canvas-missing");
        return;
      }
      const bounds = canvas.getBoundingClientRect();
      let pixels = null;
      try {
        const probe = document.createElement("canvas");
        probe.width = 32;
        probe.height = 18;
        const context = probe.getContext("2d", { willReadFrequently: true });
        context.drawImage(canvas, 0, 0, probe.width, probe.height);
        const data = context.getImageData(0, 0, probe.width, probe.height).data;
        let minimum = 255;
        let maximum = 0;
        let visible = 0;
        for (let index = 0; index < data.length; index += 4) {
          const value = Math.round((data[index] + data[index + 1] + data[index + 2]) / 3);
          minimum = Math.min(minimum, value);
          maximum = Math.max(maximum, value);
          if (value > 8) visible += 1;
        }
        pixels = { minimum, maximum, visible, total: data.length / 4 };
      } catch (error) {
        pixels = { error: error.message || String(error) };
      }
      report("canvas", {
        canvas: {
          width: canvas.width,
          height: canvas.height,
          clientWidth: Math.round(bounds.width),
          clientHeight: Math.round(bounds.height),
          top: Math.round(bounds.top),
          left: Math.round(bounds.left),
        },
        mirror: {
          active: screen.classList.contains("mirror-active"),
          width: Math.round(frameMirror.getBoundingClientRect().width),
          height: Math.round(frameMirror.getBoundingClientRect().height),
          naturalWidth: frameMirror.naturalWidth,
          naturalHeight: frameMirror.naturalHeight,
        },
        pixels,
      });
    }

    window.addEventListener("error", event => report("window-error", { message: event.message }));
    window.addEventListener("unhandledrejection", event => {
      report("unhandled-rejection", { message: event.reason?.message || String(event.reason) });
    });
    report("page-ready");

    history.replaceState(null, "", `/remote/client?device=${encodeURIComponent(device.id)}`);

    function setStatus(message, connected = false) {
      status.textContent = message;
      status.classList.toggle("connected", connected);
    }

    function websocketUrl() {
      const scheme = location.protocol === "https:" ? "wss:" : "ws:";
      const params = new URLSearchParams({ device: device.id, token });
      return `${scheme}//${location.host}/remote/ws?${params}`;
    }

    function applyScale() {
      if (!rfb) return;
      const canvas = screen.querySelector("canvas");
      if (!canvas || canvas.width <= 0 || canvas.height <= 0) return;
      const availableWidth = Math.max(1, innerWidth || document.documentElement.clientWidth);
      const availableHeight = Math.max(1, innerHeight || document.documentElement.clientHeight);
      const factor = scaleToFit
        ? Math.min(availableWidth / canvas.width, availableHeight / canvas.height)
        : 1;

      // noVNC's public scaleViewport path reads a zero-sized Compose host on
      // HyperOS. Set the Display scale from the real WebView viewport so both
      // visual size and pointer-coordinate conversion use the same factor.
      rfb.scaleViewport = false;
      if (rfb._display) {
        rfb._display.scale = factor;
      } else {
        canvas.style.width = `${canvas.width * factor}px`;
        canvas.style.height = `${canvas.height * factor}px`;
      }
      frameMirror.style.width = `${canvas.width * factor}px`;
      frameMirror.style.height = `${canvas.height * factor}px`;
    }

    function refreshScale(delay = 0) {
      clearTimeout(scaleRefreshTimer);
      scaleRefreshTimer = setTimeout(() => {
        applyScale();
      }, delay);
    }

    function updateMirror() {
      const nativeBridge = nativeFrameBridge();
      if ((!useFrameMirror && !nativeBridge) || mirrorBusy || document.hidden) return;
      const canvas = screen.querySelector("canvas");
      if (!canvas || canvas.width <= 0 || canvas.height <= 0) return;
      applyScale();
      const bounds = canvas.getBoundingClientRect();
      const cssWidth = Math.max(1, Math.round(bounds.width || innerWidth));
      const targetWidth = nativeBridge
        ? Math.max(1, nativeFrameWidth(canvas, cssWidth))
        : Math.max(1, Math.min(1280, cssWidth));
      const targetHeight = Math.max(1, Math.round(targetWidth * canvas.height / canvas.width));
      if (mirrorBuffer.width !== targetWidth) mirrorBuffer.width = targetWidth;
      if (mirrorBuffer.height !== targetHeight) mirrorBuffer.height = targetHeight;
      const context = mirrorBuffer.getContext("2d", { alpha: false });
      context.drawImage(canvas, 0, 0, targetWidth, targetHeight);
      if (nativeBridge) {
        try {
          const encoded = mirrorBuffer.toDataURL("image/jpeg", 0.9);
          nativeBridge.onFrame(encoded, targetWidth, targetHeight, canvas.width, canvas.height);
          if (!nativeFrameReported) {
            nativeFrameReported = true;
            report("native-frame", {
              canvas: { width: canvas.width, height: canvas.height },
              nativeFrame: {
                width: targetWidth,
                height: targetHeight,
                encodedBytes: encoded.length,
                qualityMode: nativeQualityMode,
              },
            });
          }
        } catch (error) {
          report("native-frame-error", { message: error.message || String(error) });
        }
      }
      if (!useFrameMirror) return;
      mirrorBusy = true;
      mirrorBuffer.toBlob(blob => {
        mirrorBusy = false;
        if (!blob) return;
        const nextUrl = URL.createObjectURL(blob);
        frameMirror.onload = () => {
          if (mirrorUrl) URL.revokeObjectURL(mirrorUrl);
          mirrorUrl = nextUrl;
          screen.classList.add("mirror-active");
        };
        frameMirror.src = nextUrl;
      }, "image/jpeg", 0.78);
    }

    function startMirror() {
      clearInterval(mirrorTimer);
      if (!useFrameMirror && !nativeFrameBridge()) return;
      updateMirror();
      mirrorTimer = setInterval(updateMirror, 250);
    }

    function stopMirror() {
      clearInterval(mirrorTimer);
      mirrorTimer = 0;
      screen.classList.remove("mirror-active");
    }

    function connect() {
      if (rfb) {
        try { rfb.disconnect(); } catch (_) { /* already closed */ }
      }
      setStatus(`正在连接 ${device.name}…`);
      rfb = new RFB(screen, websocketUrl(), { credentials, shared: true });
      rfb.scaleViewport = false;
      rfb.resizeSession = false;
      rfb.clipViewport = false;
      rfb.dragViewport = false;
      rfb.focusOnClick = true;
      rfb.viewOnly = false;
      rfb.showDotCursor = true;
      rfb.qualityLevel = 6;
      rfb.compressionLevel = 2;
      rfb.addEventListener("connect", () => {
        setStatus(`${device.name} 已连接`, true);
        nativeFrameBridge()?.onStatus?.(`${device.name} 已连接`, true);
        rfb.focus();
        refreshScale();
        refreshScale(250);
        setTimeout(() => refreshScale(), 1_000);
        startMirror();
        report("connected");
        setTimeout(reportCanvas, 1_000);
        setTimeout(reportCanvas, 4_000);
      });
      rfb.addEventListener("credentialsrequired", () => rfb.sendCredentials(credentials));
      rfb.addEventListener("disconnect", event => {
        stopMirror();
        setStatus(event.detail.clean ? `${device.name} 已断开` : "连接中断，可以点击重连");
        nativeFrameBridge()?.onStatus?.(
          event.detail.clean ? `${device.name} 已断开` : "连接中断，可以点击重连",
          false,
        );
        report("disconnected", { message: event.detail.clean ? "clean" : "unclean" });
      });
      rfb.addEventListener("securityfailure", event => {
        setStatus(event.detail.reason || "远程桌面认证失败");
        report("security-failure", { message: event.detail.reason || "authentication failed" });
      });
      rfb.addEventListener("desktopname", event => {
        document.title = `${event.detail.name || device.name} · Codex Pocket`;
      });
    }

    function sendKeysym(keysym, code = null) {
      if (rfb) rfb.sendKey(keysym, code);
    }

    function sendText(text) {
      if (!rfb || !text) return;
      for (const character of text) {
        const point = character.codePointAt(0);
        if (point > 0xff) {
          rfb.clipboardPasteFrom(character);
          rfb.sendKey(0xffe3, "ControlLeft", true);
          rfb.sendKey(0x76, "KeyV", true);
          rfb.sendKey(0x76, "KeyV", false);
          rfb.sendKey(0xffe3, "ControlLeft", false);
        } else {
          sendKeysym(point);
        }
      }
    }

    document.getElementById("keyboardButton").addEventListener("click", () => {
      keyboardPanel.classList.toggle("open");
      if (keyboardPanel.classList.contains("open")) {
        keyboardInput.focus();
      } else {
        keyboardInput.blur();
        rfb?.focus();
      }
    });
    keyboardInput.addEventListener("input", event => {
      const text = event.data || keyboardInput.value;
      sendText(text);
      keyboardInput.value = "";
    });
    keyboardInput.addEventListener("keydown", event => {
      const special = {
        Enter: 0xff0d, Backspace: 0xff08, Tab: 0xff09, Escape: 0xff1b,
        ArrowLeft: 0xff51, ArrowUp: 0xff52, ArrowRight: 0xff53, ArrowDown: 0xff54,
        Delete: 0xffff,
      }[event.key];
      if (special) {
        event.preventDefault();
        event.stopPropagation();
        sendKeysym(special, event.code || null);
      }
    });
    document.getElementById("ctrlAltDelButton").addEventListener("click", () => rfb?.sendCtrlAltDel());
    document.getElementById("fitButton").addEventListener("click", event => {
      scaleToFit = !scaleToFit;
      refreshScale();
      event.currentTarget.textContent = scaleToFit ? "适应" : "原始";
    });
    document.getElementById("reconnectButton").addEventListener("click", connect);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) keyboardInput.blur();
    });
    window.codexPocketRemoteDisconnect = () => {
      stopMirror();
      try { rfb?.disconnect(); } catch (_) { /* already disconnected */ }
    };
    window.codexPocketRemoteReconnect = connect;
    window.codexPocketNativeReconnect = connect;
    window.codexPocketNativeCtrlAltDelete = () => rfb?.sendCtrlAltDel();
    window.codexPocketNativeSendText = sendText;
    window.codexPocketNativeSetQuality = mode => {
      const allowed = new Set(["auto", "smooth", "high", "original"]);
      if (!allowed.has(mode)) return;
      nativeQualityMode = mode;
      nativeFrameReported = false;
      updateMirror();
    };
    window.codexPocketNativeFrameDisplayed = (width, height) => {
      report("native-frame-displayed", {
        nativeFrame: {
          width: Number(width) || 0,
          height: Number(height) || 0,
          qualityMode: nativeQualityMode,
        },
      });
    };
    window.addEventListener("resize", () => refreshScale(100));
    window.addEventListener("orientationchange", () => refreshScale(250));
    new ResizeObserver(() => {
      const canvas = screen.querySelector("canvas");
      if (canvas && canvas.getBoundingClientRect().width === 0) refreshScale(50);
    }).observe(screen);
    connect();
  </script>
</body>
</html>
